name: Reproduce results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/requirements-figures.txt
      - run: pip install -r environment/requirements-figures.txt
      - run: python datasets/check_data.py --data data
      - run: bash experiments/all_from_outputs.sh
      - run: python scripts/verify_release.py --results results
